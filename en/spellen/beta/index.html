<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-root="../../../" data-page="spellen" data-path="spellen/beta/index.html">
<div data-header></div>
<main>
  <section class="page-hero" style="padding-bottom:28px">
    <div class="container">
      <a class="eyebrow" href="../index.html">← All games</a>
      <h1 style="font-size:clamp(48px,9vw,112px)">Beta of the Day</h1>
      <p class="lead">Puzzle for <span data-day></span>. Everyone gets the same wall.</p>
    </div>
  </section>
  <section class="section section--tight">
    <div class="container game-wrap">
      <div>
        <div class="stage" data-stage>
          <canvas aria-label="Game area Beta of the Day"></canvas>
          <div class="hud"><span data-hud-l></span><span data-hud-r></span></div>
          <div class="overlay"></div>
        </div>
        <div class="controls"><button class="btn" type="button" data-undo>Undo</button><button class="btn" type="button" data-restart>Restart</button></div>
      </div>
      <aside class="side card">
        <h3>How to play</h3>
        <ol><li>You start at the bottom, at START.</li><li>Tap a hold inside your dotted circle.</li><li>No climbing down.</li><li>Reach the TOP in as few moves as you can.</li><li>A new wall tomorrow.</li></ol>
        <h3 style="margin-top:8px">To unlock</h3>
        <ul class="unlock-list" data-unlocks></ul>
        <p class="best" data-best style="margin-top:16px"></p>
        <a class="btn btn--small" href="../../kluis/index.html">Go to the vault</a>
      </aside>
    </div>
  </section>
</main>
<div data-footer></div>
